# dbt/models/marts/schema.yml
version: 2

models:
  - name: fct_jobs
    description: >
      The only fact table. Grain: one job opening = one job posting in one Saudi location, after
      the listings of the same posting on several sources have been merged. Accumulating snapshot
      with three date roles (posted, first seen, last seen). Job openings = SUM(job_count);
      job postings = COUNT(DISTINCT posting_sk); listings = SUM(listing_count).
      See data_model.md, Sections 4 and 7.
    data_tests:
      # the grain: one row per posting and location
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['posting_sk', 'location_sk']
      - dbt_utils.expression_is_true:
          arguments:
            expression: "first_seen_date_sk <= last_seen_date_sk"
    columns:
      - name: job_sk
        description: "Key of the job opening: source_record_sk of its earliest listing."
        data_tests:
          - unique
          - not_null
      - name: posting_sk
        description: "Job posting of the representative listing. Count postings with COUNT(DISTINCT posting_sk)."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_job_posting')
                field: posting_sk
      - name: company_sk
        description: "Company; '-1' when the name is missing or a placeholder such as Private Company."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_company')
                field: company_sk
      - name: location_sk
        description: "Location at the most precise level the source gave (city, region or country)."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_location')
                field: location_sk
      - name: job_attributes_sk
        description: "Job category, employment type, workplace type, remote status and experience level; '-1' when all five are Unknown."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_job_attributes')
                field: job_attributes_sk
      - name: primary_source_sk
        description: "Source of the representative listing (highest source_priority)."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_source')
                field: source_sk
      - name: posting_date_sk
        description: "Role: posted. Earliest ATS posting date, else the earliest of any listing; -1 when none has one."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_sk
      - name: first_seen_date_sk
        description: "Role: first seen. Earliest collection in which any listing appeared."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_sk
      - name: last_seen_date_sk
        description: "Role: last seen. Latest collection in which any listing appeared."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_sk
      - name: job_count
        description: "1 per row: one job opening. Additive."
      - name: listing_count
        description: "Listings merged into the opening; 1 when nothing was merged. Additive."
      - name: listing_count_workable
        description: "Listings from workable. The six per-source counts add up to listing_count."
      - name: listing_count_smartrecruiters
        description: "Listings from smartrecruiters. The six per-source counts add up to listing_count."
      - name: listing_count_ashby
        description: "Listings from ashby. The six per-source counts add up to listing_count."
      - name: listing_count_greenhouse
        description: "Listings from greenhouse. The six per-source counts add up to listing_count."
      - name: listing_count_jsearch
        description: "Listings from jsearch. The six per-source counts add up to listing_count."
      - name: listing_count_jooble
        description: "Listings from jooble. The six per-source counts add up to listing_count."
      - name: copies_landed
        description: "Copies of the opening's listings landed in RAW before within-source deduplication. Additive."
      - name: source_count
        description: "Distinct sources among the listings, 1 to 6. Non-additive: source_count > 1 marks cross-source overlap."
      - name: days_open
        description: "Days from the posting date to the last time the opening was seen; null without a posting date. Summarize with a median, never sum."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: is_active
        description: "Still advertised at the last collection of its source. From employer-board listings when the opening has one."
        data_tests:
          - not_null
      - name: status_basis
        description: "What is_active is based on: 'employer board' (last collection 24 Sep) or 'aggregator query' (9-11 Sep). Split active counts by it."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['employer board', 'aggregator query']

  - name: dim_job_posting
    description: "One row per job posting, plus Unknown. One-to-many with fct_jobs: a Workable posting open in several cities has one opening per city."
    columns:
      - name: posting_sk
        description: "Hash of source_name and source_job_id of the representative listing."
        data_tests:
          - unique
          - not_null
          - has_one_unknown_member
      - name: job_title
        description: "Title as published by the representative listing."
      - name: description_text
        description: "Plain text: HTML entities decoded, tags removed. A snippet only when the posting was found on Jooble alone."
      - name: job_url
        description: "Link to the posting."
      - name: apply_url
        description: "Link to apply, when the source gives one."
      - name: salary_text
        description: "Salary as free text when a listing has one (in practice Jooble). Display only, not analysed."

  - name: dim_company
    description: "One row per company (company_norm), plus Unknown for missing names and placeholders."
    columns:
      - name: company_sk
        description: "Hash of company_norm; '-1' for Unknown."
        data_tests:
          - unique
          - not_null
          - has_one_unknown_member
      - name: company_name
        description: "Standard name from seed_company_aliases when listed there, otherwise the name of the company's highest-priority listing."
      - name: company_norm
        description: "Matching key: lower-case, punctuation and legal suffixes removed, aliases resolved."
      - name: industry
        description: "Most frequent industry across the company's listings (Workable and SmartRecruiters only)."
      - name: is_recruitment_agency
        description: "From seed_company_aliases. Agencies advertise for clients: Q3 excludes them and Q7 is shown with and without them."
        data_tests:
          - not_null

  - name: dim_location
    description: "One row per location used by an opening. Hierarchy: country -> region -> city."
    columns:
      - name: location_sk
        description: "Hash of city, region and location_level; '-1' for Unknown."
        data_tests:
          - unique
          - not_null
          - has_one_unknown_member
      - name: city
        description: "Standard city from seed_city_mapping; 'Unknown' on region- and country-level rows (use location_label in reports)."
      - name: region
        description: "One of the 13 Saudi regions; 'Unknown' on country-level rows."
      - name: country
        description: "'SA'."
      - name: location_level
        description: "Most precise level the source gave: city, region or country ('unknown' only on the -1 member)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['city', 'region', 'country', 'unknown']
      - name: location_label
        description: "Display name: the city, '<region> (no city given)', or 'Saudi Arabia (no city given)'."
        data_tests:
          - not_null

  - name: dim_job_attributes
    description: "Junk dimension: five short attributes, one row per observed combination. The all-Unknown combination is the Unknown member ('-1')."
    columns:
      - name: job_attributes_sk
        description: "Hash of the five attributes; '-1' when all five are Unknown."
        data_tests:
          - unique
          - not_null
          - has_one_unknown_member
      - name: job_category
        description: "18 categories from title keywords (seed_job_categories); Other when no keyword matches; Unknown without a title."
        data_tests:
          - not_null
      - name: employment_type
        description: "Normalized employment type; Unknown when the source gives none."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Full-time', 'Part-time', 'Contract', 'Internship', 'Temporary', 'Volunteer', 'Full-time and Part-time', 'Other', 'Unknown']
      - name: workplace_type
        description: "Remote, Hybrid or OnSite when the source distinguishes them."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Remote', 'Hybrid', 'OnSite', 'Unknown']
      - name: remote_status
        description: "From workplace_type first, then the source's remote flag. Hybrid is Not remote. Used for Q6."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Remote', 'Not remote', 'Unknown']
      - name: experience_level
        description: "Closed list mapped by seed_experience_levels (Workable and SmartRecruiters only)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Internship', 'Entry', 'Associate', 'Mid-Senior', 'Director', 'Executive', 'Unknown']

  - name: dim_source
    description: "The six sources from seed_sources, plus Unknown."
    columns:
      - name: source_sk
        description: "Hash of source_name; '-1' for Unknown."
        data_tests:
          - unique
          - not_null
          - has_one_unknown_member
      - name: source_name
        description: "ashby, workable, greenhouse, smartrecruiters, jsearch or jooble."
      - name: source_type
        description: "ATS (employer job boards: a missing posting was taken down) or Aggregator (query results)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ATS', 'Aggregator', 'Unknown']
      - name: collection_method
        description: "Company board API or Query matrix API."
      - name: source_priority
        description: "1 to 6: the order used to choose an opening's representative listing."

  - name: dim_date
    description: "Role-playing date dimension, joined three times by fct_jobs (posted, first seen, last seen). From the oldest posting date to the last collection, plus -1."
    columns:
      - name: date_sk
        description: "YYYYMMDD; -1 for Unknown."
        data_tests:
          - unique
          - not_null
          - has_one_unknown_member:
              arguments:
                unknown_value: -1
      - name: full_date
        description: "The calendar date."
      - name: day_of_week
        description: "Day name."
      - name: week_start_date
        description: "The Sunday that starts the week (Saudi working week). Used for weekly trends (Q8)."
      - name: month
        description: "Month number."
      - name: quarter
        description: "Quarter number."
      - name: year
        description: "Year."
      - name: is_weekend
        description: "Friday or Saturday."