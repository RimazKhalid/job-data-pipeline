# dbt/models/marts/schema.yml
# Marts of data model v3: galaxy schema. Two facts (fct_jobs, fct_job_weeks) share the dimensions;
# two bridges (bridge_job_skill, bridge_job_listing) carry the many-to-many paths; two data quality
# marts sit outside the star. Tests follow data model v3, section 9.
version: 2

models:
  # ---------------------------------------------------------------- facts
  - name: fct_jobs
    description: >
      Accumulating snapshot. Grain: one job = one job advertisement in one Saudi location, after
      cross-source matching. One date column per milestone (posted, first seen, last seen, open
      until, opening, disappeared). Jobs = SUM(job_count). days_listed is summarised with a median.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "first_seen_date_sk <= last_seen_date_sk"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "open_until_date_sk >= first_seen_date_sk"
      # disappeared date exactly when the job disappeared; duration only then
      - dbt_utils.expression_is_true:
          arguments:
            expression: "iff(lifecycle_status = 'disappeared', disappeared_date_sk <> -1 and days_listed is not null, disappeared_date_sk = -1 and days_listed is null)"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "is_censored = (lifecycle_status <> 'disappeared')"
      # a new opening is never a baseline job
      - dbt_utils.expression_is_true:
          arguments:
            expression: "iff(is_baseline, opening_date_sk = -1, opening_date_sk = first_seen_date_sk)"
    columns:
      - name: job_sk
        description: "Job key from matching: source_record_sk of the job's earliest listing."
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_job_posting')
                field: job_sk
      - name: company_sk
        description: "Employer; '-1' = Employer not disclosed (no name, or a placeholder)."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_company')
                field: company_sk
      - name: location_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_location')
                field: location_sk
      - name: role_sk
        description: "Job category and role family; '-1' when the job has no usable title."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_role')
                field: role_sk
      - name: job_attributes_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_job_attributes')
                field: job_attributes_sk
      - name: posting_date_sk
        data_tests: &date_fk
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_sk
      - name: first_seen_date_sk
        data_tests: *date_fk
      - name: last_seen_date_sk
        data_tests: *date_fk
      - name: open_until_date_sk
        data_tests: *date_fk
      - name: opening_date_sk
        data_tests: *date_fk
      - name: disappeared_date_sk
        data_tests: *date_fk
      - name: lifecycle_status
        description: "open or disappeared from employer-board evidence; unknown for a job found on aggregators only."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['open', 'disappeared', 'unknown']
      - name: is_baseline
        data_tests:
          - not_null
      - name: job_count
        data_tests:
          - accepted_values:
              arguments:
                values: [1]
                quote: false
      - name: days_listed
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: days_listed_basis
        data_tests:
          - accepted_values:
              arguments:
                values: ['posted', 'first_seen']
      - name: salary_currency
        data_tests:
          - accepted_values:
              arguments:
                values: ['SAR', 'USD']
      - name: salary_period
        data_tests:
          - accepted_values:
              arguments:
                values: ['hour', 'day', 'week', 'month', 'year']

  - name: fct_job_weeks
    description: >
      Periodic snapshot. Grain: one job in one week (Sunday to Saturday) during which it was open.
      Stock questions sum job_count per week; flow questions filter is_new_in_week. Report weekly
      answers for is_complete_week = true only.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['job_sk', 'week_date_sk']
    columns:
      - name: job_week_sk
        data_tests:
          - unique
          - not_null
      - name: job_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_jobs')
                field: job_sk
      - name: week_date_sk
        data_tests: *date_fk
      - name: company_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_company')
                field: company_sk
      - name: location_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_location')
                field: location_sk
      - name: role_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_role')
                field: role_sk
      - name: job_attributes_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_job_attributes')
                field: job_attributes_sk
      - name: is_new_in_week
        data_tests:
          - not_null
      - name: is_complete_week
        data_tests:
          - not_null

  # ---------------------------------------------------------------- bridges
  - name: bridge_job_skill
    description: "One row per job per skill. Count jobs with DISTINCTCOUNT(job_sk) when a skill is in the filter."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['job_sk', 'skill_sk']
    columns:
      - name: job_skill_sk
        data_tests:
          - unique
          - not_null
      - name: job_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_jobs')
                field: job_sk
      - name: skill_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_skill')
                field: skill_sk
      - name: matched_in
        data_tests:
          - accepted_values:
              arguments:
                values: ['title', 'description']

  - name: bridge_job_listing
    description: "One row per staged listing, with the job it was matched to. Count jobs with DISTINCTCOUNT(job_sk) when a source is in the filter."
    columns:
      - name: source_record_sk
        data_tests:
          - unique
          - not_null
      - name: job_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_jobs')
                field: job_sk
      - name: source_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_source')
                field: source_sk
      - name: match_tier
        data_tests:
          - accepted_values:
              arguments:
                values: ['single', 'exact', 'fuzzy']
      - name: first_seen_date_sk
        data_tests: *date_fk
      - name: last_seen_date_sk
        data_tests: *date_fk

  # ---------------------------------------------------------------- dimensions
  - name: dim_job_posting
    description: "What the job is: title, description, URLs. 1:1 with fct_jobs, plus the Unknown member."
    columns:
      - name: job_sk
        data_tests:
          - unique
          - not_null
          - has_one_unknown_member
      - name: description_basis
        data_tests:
          - accepted_values:
              arguments:
                values: ['full', 'snippet', 'none']

  - name: dim_company
    description: "Who is hiring: one row per employer after entity resolution; '-1' = Employer not disclosed."
    columns:
      - name: company_sk
        data_tests:
          - unique
          - not_null
          - has_one_unknown_member
      - name: company_key
        data_tests:
          - unique
      - name: is_recruitment_intermediary
        data_tests:
          - not_null

  - name: dim_location
    description: "Where: country -> region -> city, at the most precise level known."
    columns:
      - name: location_sk
        data_tests:
          - unique
          - not_null
          - has_one_unknown_member
      - name: location_level
        data_tests:
          - accepted_values:
              arguments:
                values: ['city', 'region', 'country', 'unknown']

  - name: dim_role
    description: "What role: role_family -> job_category."
    columns:
      - name: role_sk
        data_tests:
          - unique
          - not_null
          - has_one_unknown_member
      - name: job_category
        data_tests:
          - unique
          - not_null

  - name: dim_job_attributes
    description: "Junk dimension: employment type, workplace type, seniority, seniority basis."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['employment_type', 'workplace_type', 'seniority', 'seniority_basis']
    columns:
      - name: job_attributes_sk
        data_tests:
          - unique
          - not_null
          - has_one_unknown_member
      - name: employment_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['Full-time', 'Part-time', 'Contract', 'Internship', 'Temporary', 'Volunteer', 'Full-time and Part-time', 'Other', 'Unknown']
      - name: workplace_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['Remote', 'Hybrid', 'OnSite', 'Unknown']
      - name: seniority
        data_tests:
          - accepted_values:
              arguments:
                values: ['Internship', 'Entry', 'Associate', 'Mid-Senior', 'Director', 'Executive', 'Unknown']
      - name: seniority_basis
        data_tests:
          - accepted_values:
              arguments:
                values: ['source', 'title', 'unknown']

  - name: dim_skill
    description: "Which skills: one row per canonical skill of seed_skills."
    columns:
      - name: skill_sk
        data_tests:
          - unique
          - not_null
          - has_one_unknown_member
      - name: skill_name
        data_tests:
          - unique

  - name: dim_source
    description: "Where a listing was collected; reached through bridge_job_listing."
    columns:
      - name: source_sk
        data_tests:
          - unique
          - not_null
          - has_one_unknown_member
      - name: source_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['ATS', 'Aggregator', 'Unknown']

  - name: dim_date
    description: "Calendar in Asia/Riyadh; role-playing for every date of both facts; -1 = no date."
    columns:
      - name: date_sk
        data_tests:
          - unique
          - not_null
          - has_one_unknown_member:
              arguments:
                unknown_value: -1

  # ---------------------------------------------------------------- data quality marts
  - name: mart_dq_source
    description: "One row per source per run date (incremental, merged on run_date + source_name)."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['run_date', 'source_name']
    columns:
      - name: run_date
        data_tests:
          - not_null

  - name: mart_dq_matching
    description: "One row per run date (incremental, merged on run_date)."
    columns:
      - name: run_date
        data_tests:
          - unique
          - not_null
