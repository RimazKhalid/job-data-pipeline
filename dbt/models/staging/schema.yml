  - name: stg_workable_jobs
    description: "Workable postings, one row per posting per city. A job posted in several cities arrives as one object per city under the same shortcode, so source_job_id repeats by design and is not tested for uniqueness."
    columns:
      - name: source_record_sk
        description: "Surrogate key: hash of source_name + source_job_id (plus city_raw in Workable). Unique across all six sources."
        data_tests:
          - unique
          - not_null
      - name: source_job_id
        data_tests:
