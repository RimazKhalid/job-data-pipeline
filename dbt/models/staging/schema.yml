version: 2

# Tests for the staging layer. Nulls pass accepted_values by design: a missing value is a
# completeness question, handled by not_null only where a value is required.

models:
  - name: stg_ashby_jobs
    description: "Ashby postings, one row per posting."
    columns:
      - name: source_record_sk
        description: "Surrogate key: hash of source_name + source_job_id (plus city_raw in Workable). Unique across all six sources."
        data_tests:
          - unique
          - not_null
      - name: source_job_id
        data_tests:
          - not_null
      - name: ingested_at
        data_tests:
          - not_null
      - name: workplace_type_raw
        data_tests:
          - accepted_values:
              arguments:
                values: ['Remote', 'Hybrid', 'OnSite']
      - name: employment_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['Full-time', 'Part-time', 'Contract', 'Internship', 'Temporary', 'Volunteer', 'Other']

  - name: stg_greenhouse_jobs
    description: "Greenhouse postings, one row per posting."
    columns:
      - name: source_record_sk
        description: "Surrogate key: hash of source_name + source_job_id (plus city_raw in Workable). Unique across all six sources."
        data_tests:
