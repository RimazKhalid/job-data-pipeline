      - name: employment_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['Full-time', 'Part-time', 'Contract', 'Internship', 'Temporary', 'Volunteer', 'Other']

  - name: stg_jooble_jobs
    description: "Jooble postings, one row per posting. Copies landed by overlapping queries are removed here."
    columns:
      - name: source_record_sk
        description: "Surrogate key: hash of source_name + source_job_id (plus city_raw in Workable). Unique across all six sources."
        data_tests:
          - unique
          - not_null
      - name: source_job_id
        description: "Unique here because within-source duplicates are removed in this model."
        data_tests:
          - unique
          - not_null
      - name: ingested_at
        data_tests:
          - not_null
      - name: workplace_type_raw
        data_tests:
